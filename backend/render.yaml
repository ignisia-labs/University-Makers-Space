# Render deployment for the सृजन API.
#
# The API no longer runs background workers in-process, so it deploys equally
# well here or on a serverless platform. What it does need is a scheduler: the
# cron job below calls the maintenance endpoint every minute to release no-shows,
# close overstayed visits and drain the mail outbox. Without it those things
# simply never happen.

services:
  - type: web
    name: srijan-api
    runtime: node
    plan: starter
    rootDir: backend
    # Migrations run at build time, before the new instance takes traffic, so a
    # release never serves against a schema it was not compiled for.
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render supplies PORT; the app already reads it.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
      # The app and API are on different hosts, so the session cookie must be
      # SameSite=None or the browser will never send it back.
      - key: CROSS_SITE_COOKIES
        value: "true"
      # Shared with the cron job below. Generated once and used by both.
      - key: JOBS_TOKEN
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  # Scheduled maintenance. The web service exposes the work over HTTP; this calls
  # it. Set JOBS_TOKEN here to the same value the web service generated.
  - type: cron
    name: srijan-maintenance
    runtime: node
    plan: starter
    rootDir: backend
    schedule: "* * * * *"
    buildCommand: npm ci
    startCommand: >-
      curl --fail --silent --show-error -X POST
      "$API_URL/api/v1/jobs/run"
      -H "X-Jobs-Token: $JOBS_TOKEN"
    envVars:
      - key: API_URL
        sync: false
      - key: JOBS_TOKEN
        sync: false
